  {t:"VI cornice — Golosi", d:"Dimagriti, tra alberi dai frutti irraggiungibili."},
  {t:"V cornice — Avari e prodighi", d:"Distesi a terra, volto rivolto in basso."},
  {t:"IV cornice — Accidiosi", d:"In corsa continua, per espiare la lentezza nel bene."},
  {t:"III cornice — Iracondi", d:"Avvolti da un fumo denso e acre."},
  {t:"II cornice — Invidiosi", d:"Occhi cuciti con fili di ferro."},
  {t:"I cornice — Superbi (canto XI)", d:"Curvi sotto massi di pietra."},
  {t:"Porta del Purgatorio", d:"Le tre scale, l'angelo con le sette P incise sulla fronte di Dante, una per ogni peccato capitale."},
  {t:"Valletta dei Principi (canto VI)", d:"Sordello e i principi negligenti, distratti dagli affari politici."},
  {t:"Antipurgatorio — scomunicati (canto III)", d:"Manfredi e i pentiti in punto di morte dopo scomunica."},
  {t:"Antipurgatorio — morti violente (canto V)", d:"Iacopo del Cassero, Bonconte, Pia de' Tolomei."},
  {t:"Spiaggia del Purgatorio (canto I)", d:"Approdo, Catone, il rito del giunco."}
];

let current = "presentazione";

function tabsHTML(){
  const items = [["presentazione","Presentazione"],["schema","Schema"], ...CANTI.map(c=>[c.id, c.numero])];
  return items.map(([id,label])=>`<button data-tab="${id}" class="${id===current?'active':''}" onclick="showTab('${id}')">${label}</button>`).join("");
}

function fontiHTML(){
  return `<div class="links3">${FONTI.map(f=>`<a href="${f.url}" target="_blank" rel="noopener" title="${f.desc}">${f.label}</a>`).join("")}</div>`;
}

const ROMANO_NUM = {I:1, III:3, V:5, VI:6, XI:11, XXX:30};

function vademecumHTML(cantoId){
  const n = cantoId ? ROMANO_NUM[cantoId] : null;
  const stepCanto = n
    ? `<li>In <b>«Canto (1-34)»</b> inserisci <b>${n}</b> (il canto ${cantoId} corrisponde al numero arabo ${n}).</li>`
    : `<li>In <b>«Canto (1-34)»</b> inserisci il numero arabo del canto che ti interessa (es. Canto I → 1, Canto XXX → 30).</li>`;
  return `
  <div class="card">
    <h3>Vademecum — come cercare un canto sul Dartmouth Dante Project</h3>
    <ol class="guida">
      <li>Apri <a href="https://dante.dartmouth.edu/" target="_blank" rel="noopener">dante.dartmouth.edu</a> e vai alla pagina <i>«Search the Commentaries»</i>.</li>
      <li>Nel menu <b>«Language»</b> seleziona <b>Italian</b>, per avere i commenti in lingua italiana.</li>
      <li>Nel menu <b>«Cantica»</b> seleziona <b>Purgatorio</b>.</li>
      ${stepCanto}
      <li>Lascia vuoto il campo <b>«Line (1-160)»</b> per leggere il commento all'intero canto, oppure inserisci un verso preciso se cerchi un passo specifico.</li>
      <li>Nella lista <b>«Commentary»</b> scegli un commentatore: per iniziare, il commento di <b>Emilio Pasquini e Antonio Quaglio (1982)</b> è il più indicato per gli studenti, perché unisce una parafrasi chiara e puntuale a note essenziali; per approfondire restano ottimi anche <b>Umberto Bosco e Giovanni Reggio (1979)</b> e <b>Anna Maria Chiavacci Leonardi (1991-1997)</b>.</li>
      <li>Premi <b>«Search»</b>: il sistema restituisce il testo del canto affiancato dal commento/parafrasi del curatore scelto.</li>
    </ol>
  </div>`;
}

function jumprowHTML(activeId){
  return `<div class="jumprow">${CANTI.map(c=>`<button class="${c.id===activeId?'current':''}" onclick="showTab('${c.id}')">${c.numero}</button>`).join("")}</div>`;
}

function presentazioneHTML(){
  return `
  <section class="view active" id="view-presentazione">
    <div class="card">
      <span class="badge">Proemio della cantica</span>
      <h2>Il Purgatorio: struttura e senso del viaggio</h2>
      <p>Il Purgatorio è la seconda cantica della <i>Commedia</i>: un'isola-montagna nell'emisfero australe, sorta — secondo la geografia dantesca — dallo spostamento di terra causato dalla caduta di Lucifero. Qui le anime, già salve, espiano volontariamente le tracce dei peccati commessi in vita, in un percorso a tempo (dalla mattina di Pasqua 1300 in poi) scandito dal sorgere e tramontare del sole.</p>
      <p>Rispetto all'Inferno, cambia radicalmente il registro: non più pena eterna e immutabile, ma un cammino di purificazione condiviso, fatto di speranza, canto, preghiera collettiva e progressiva leggerezza. La struttura è tripartita: <b>Antipurgatorio</b> (anime negligenti, in attesa), <b>sette cornici</b> corrispondenti ai vizi capitali, <b>Paradiso Terrestre</b> in vetta, luogo dell'incontro con Beatrice.</p>
      <p>Questa app propone i sei canti più studiati e antologizzati della cantica, ciascuno con collegamento alle fonti, una scheda del protagonista, una scheda guida per la comprensione e venti quesiti di verifica con soluzione.</p>
      <h3>Fonti istituzionali per il testo, la parafrasi e il commento</h3>
      ${fontiHTML()}
    </div>
    ${vademecumHTML(null)}
    <div class="card">
      <h2>Il contrappasso nel Purgatorio: significato e durata delle pene</h2>
      <p>Nell'Inferno il contrappasso è <b>per analogia o per contrasto</b> ed è <b>eterno e immutabile</b>: la pena riproduce o rovescia il peccato come condanna fissata per sempre, senza possibilità di redenzione. Nel Purgatorio il principio resta simile nella forma — ogni pena richiama ancora, per analogia, il vizio da cui si origina — ma cambia radicalmente nella <b>funzione</b> e nel <b>tempo</b>.</p>
      <ul class="guida">
        <li><b>Funzione pedagogica, non punitiva:</b> la pena non è vendetta divina ma cura dell'anima; è accettata e persino desiderata dai penitenti, che collaborano attivamente alla propria purificazione (pregano, si correggono a vicenda, si rallegrano dei progressi altrui).</li>
        <li><b>Temporaneità:</b> ogni pena ha una durata limitata. Le anime salgono di cornice in cornice man mano che il vizio corrispondente è estirpato; ogni passaggio è segnato da un terremoto e da un canto di lode (il <i>Gloria in excelsis Deo</i>), festeggiato da tutta la montagna.</li>
        <li><b>Contrappasso "per analogia" nelle cornici:</b> i superbi (canto XI) portano massi che li curvano, a imitare fisicamente il peso morale dell'orgoglio; gli invidiosi hanno le palpebre cucite, perché in vita non sopportavano di vedere il bene altrui; gli accidiosi corrono senza sosta, per compensare la lentezza nel bene; i golosi dimagriscono davanti a frutti irraggiungibili.</li>
        <li><b>Attesa nell'Antipurgatorio:</b> i negligenti (scomunicati pentiti come Manfredi, morti di morte violenta come Bonconte e Pia, principi distratti dal potere come quelli della Valletta) devono attendere, prima di poter iniziare la vera purificazione, un tempo pari a quello in cui rimandarono il pentimento in vita — tempo che può essere abbreviato dalle preghiere dei vivi, come chiede Manfredi a Dante.</li>
        <li><b>Fattori che accelerano o abbreviano la pena:</b> il pentimento sincero (anche tardivo, come per Bonconte), un singolo gesto di grande umiltà (Provenzan Salvani, canto XI) e soprattutto la preghiera di chi resta in vita, che crea un legame attivo tra i due mondi assente nell'Inferno.</li>
        <li><b>Il traguardo finale:</b> una volta espiato l'ultimo vizio, l'anima riacquista la piena libertà della volontà ed è pronta ad ascendere al Paradiso Terrestre: è il momento, per Dante personaggio, dell'incontro con Beatrice (canto XXX).</li>
      </ul>
    </div>
    <div class="card">
      <h3>I sei canti proposti</h3>
      ${jumprowHTML(null)}
    </div>
  </section>`;
}

function schemaHTML(){
  return `
  <section class="view active" id="view-schema">
    <div class="card">
      <h2>Schema del Purgatorio</h2>
      <p>Dal basso verso l'alto: la spiaggia d'approdo, l'Antipurgatorio, la Porta, le sette cornici dei vizi capitali, il Paradiso Terrestre.</p>
      <div class="schema">
        ${SCHEMA.map(s=>`<div class="liv"><b>${s.t}</b><br>${s.d}</div>`).join("")}
      </div>
    </div>
  </section>`;
}

function cantoHTML(c){
  return `
  <section class="view active" id="view-${c.id}">
    <div class="card">
      <span class="badge">${c.badge}</span>
      <h2>${c.numero} — ${c.titolo}</h2>
      <h3>Fonti istituzionali</h3>
      ${fontiHTML()}
    </div>
    ${vademecumHTML(c.id)}
    <div class="card">
      <h3>Scheda del protagonista — ${c.protagonista.nome}</h3>
      <ul class="guida">${c.protagonista.scheda.map(g=>`<li>${g}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>Scheda guida per la comprensione</h3>
      <ul class="guida">${c.guida.map(g=>`<li>${g}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>Verifica — 20 quesiti a risposta multipla</h3>
      <div class="progress">Clicca un'opzione, poi "Mostra soluzione" per la spiegazione.</div>
      <div id="quiz-${c.id}"></div>
    </div>
    <div class="card">
      <h3>Naviga tra i canti</h3>
      ${jumprowHTML(c.id)}
    </div>
  </section>`;
}

function renderQuiz(c){
  const box = document.getElementById(`quiz-${c.id}`);
  box.innerHTML = c.quiz.map((item,i)=>{
    const [q,opts,correct] = item;
    return `<div class="quiz-item">
      <p class="q">${i+1}. ${q}</p>
      <div class="opts" id="opts-${c.id}-${i}">
        ${opts.map((o,j)=>`<div class="opt" onclick="selectOpt('${c.id}',${i},${j},${correct})">${String.fromCharCode(97+j)}) ${o}</div>`).join("")}
      </div>
      <button class="reveal-btn" onclick="toggleNote('${c.id}',${i})">Mostra soluzione</button>
      <p class="note" id="note-${c.id}-${i}">Risposta corretta: <b>${String.fromCharCode(97+correct)}) ${opts[correct]}</b></p>
    </div>`;
  }).join("");
}

function selectOpt(cid,i,j,correct){
  const opts = document.getElementById(`opts-${cid}-${i}`).children;
  for(let k=0;k<opts.length;k++){opts[k].classList.remove('correct','wrong');}
  if(j===correct){opts[j].classList.add('correct');}
  else{opts[j].classList.add('wrong'); opts[correct].classList.add('correct');}
}

function toggleNote(cid,i){
  document.getElementById(`note-${cid}-${i}`).classList.toggle('show');
}

function showTab(id){
  current = id;
  document.getElementById('tabs').innerHTML = tabsHTML();
  const main = document.getElementById('main');
  if(id==="presentazione"){ main.innerHTML = presentazioneHTML(); }
  else if(id==="schema"){ main.innerHTML = schemaHTML(); }
  else{
    const c = CANTI.find(x=>x.id===id);
    main.innerHTML = cantoHTML(c);
    renderQuiz(c);
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

showTab("presentazione");
</script>
</body>
</html>
